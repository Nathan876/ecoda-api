services:
  db:
    image: postgres:16-alpine
    container_name: ecoda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoda}
      POSTGRES_USER: ${POSTGRES_USER:-ecoda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ecoda_pgdata:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, dans l'ordre alphabétique, à la création du volume
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoda_user} -d ${POSTGRES_DB:-ecoda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecoda_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecoda_pgdata:
